{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block title %}
  Подать заявку на конкурс
{% endblock %}

{% block content %}
  <div class="row">
      <div class="col-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Конкурс мороженого</h5>

            <form method="get" action="/contest/accepted/">
              {% csrf_token %}
              <table>
                {% bootstrap_form form %}
              </table>
              {% bootstrap_button button_type="submit" content="Отправить" %}
            </form>
          </div>
        </div>
      </div>
    </div>
{% endblock %}
